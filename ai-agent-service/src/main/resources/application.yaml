server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ai-agent-service
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11435}
      chat:
        model: ${SPRING_AI_OLLAMA_CHAT_MODEL:llama3.1:latest}
        options:
          temperature: 0.2
          num_predict: 2048

    mcp:
      client:
        enabled: true
        type: SYNC
        sse:
          connections:
            user-service:
              url: ${USER_SERVICE_MCP_URL:http://localhost:8081}
            product-service:
              url: ${PRODUCT_SERVICE_MCP_URL:http://localhost:8082}
            order-service:
              url: ${ORDER_SERVICE_MCP_URL:http://localhost:8083}
            payment-service:
              url: ${PAYMENT_SERVICE_MCP_URL:http://localhost:8084}
            notification-service:
              url: ${NOTIFICATION_SERVICE_MCP_URL:http://localhost:8085}

logging:
  level:
    org.springframework.ai: DEBUG
    com.ai.agent: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info